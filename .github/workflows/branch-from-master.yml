name: Validate branch from master

on:
  push:
    branches-ignore:
      - master
      - main

jobs:
  validate-branch-origin:
    name: Validate branch origin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch was created from master
        shell: bash
        run: |
          set -euo pipefail

          MASTER_REF="refs/heads/master"
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Branch being pushed: $CURRENT_BRANCH"
          echo "Current commit (HEAD): $GITHUB_SHA"

          # Fetch the latest master from origin so we compare against the real current master.
          git fetch origin master

          master_head=$(git rev-parse origin/master)
          echo "Current origin/master HEAD: $master_head"

          # Find the first commit that is unique to this branch compared to master.
          first=$(git rev-list --ancestry-path "${master_head}..${GITHUB_SHA}" | tail -n1 || true)

          if [ -z "$first" ]; then
            echo "ERROR: Could not determine the first commit of branch '$CURRENT_BRANCH'."
            exit 1
          fi

          echo "First commit exclusive to branch: $first"

          # Count parents of the first commit.
          parent_count=$(git rev-list --parents -n1 "$first" | awk '{print NF-1}')

          if [ "$parent_count" -eq 0 ]; then
            echo "ERROR: The first commit ($first) has no parent."
            exit 1
          fi

          if [ "$parent_count" -gt 1 ]; then
            echo "ERROR: The first commit ($first) is a merge commit."
            echo "       Create the branch from a simple commit on master, not a merge."
            exit 1
          fi

          parent=$(git rev-parse "${first}^")
          echo "Parent of first commit: $parent"

          if [ "$parent" != "$master_head" ]; then
            echo "ERROR: Branch '$CURRENT_BRANCH' was not created from the current HEAD of master."
            echo "       Expected master HEAD: $master_head"
            echo "       Found parent:         $parent"
            exit 1
          fi

          echo "OK: Branch '$CURRENT_BRANCH' was created from the current HEAD of master."
